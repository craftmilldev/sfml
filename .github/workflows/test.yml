name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm ci --prefix example
      - run: npm ci --prefix site
        env:
          # read:packages for @craftmilldev/analytics on GitHub Packages (see site/README.md)
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
