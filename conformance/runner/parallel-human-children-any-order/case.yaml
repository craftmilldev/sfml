description: >
  A parallel step with two human children. Resumes arrive in reverse of declared order, with a
  restart in between and a rejected resume to a child that already finished. The join waits for
  both.
clauses: ["§5.3", "§6.6", "§6.7", "§9.8", "§11.1", "§11.2", "§11.3", "§12.1"]
actions:
  - start: {}
    expect:
      status: awaiting_input
      blocked:
        - { step: approvals.security, state: awaiting_input }
        - { step: approvals.design, state: awaiting_input }
  - resume: { step: approvals.security, payload: { approved: true } }
    expect:
      status: awaiting_input
      blocked: [{ step: approvals.design, state: awaiting_input }]
      state: { parameters: {}, results: {} }
  - restart: {}
    expect:
      status: awaiting_input
      blocked: [{ step: approvals.design, state: awaiting_input }]
  - resume: { step: approvals.security, payload: { approved: false } }
    expect:
      accepted: false
  - resume: { step: approvals.design, payload: { approved: true } }
expect:
  status: terminal
  outcome: complete
  value: { ok: true }
  state:
    parameters: {}
    results:
      approvals: [{ design: { approved: true }, security: { approved: true } }]
      shipped: [{ ok: true }]
