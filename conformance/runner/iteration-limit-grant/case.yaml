description: >
  A polling step with `max_iterations: 2` is entered a third time and raises iteration_limit on
  arrival, with nothing appended. A fractional grant is rejected. A grant of 0 is a no-op: the step
  raises iteration_limit again without invoking the harness. A grant of 1 lets it run once more, on
  a new session.
clauses: ["§9.6", "§10.5", "§11.4", "§11.5", "§11.6", "§11.7"]
actions:
  - start: {}
    expect:
      status: errored
      blocked: [{ step: poll, state: errored, exception: iteration_limit }]
      state:
        parameters: {}
        results:
          poll: [{ done: false }, { done: false }]
  - resume: { step: poll, payload: 1.5 }
    expect:
      accepted: false
      status: errored
      blocked: [{ step: poll, state: errored, exception: iteration_limit }]
  - resume: { step: poll, payload: 0 }
    expect:
      status: errored
      blocked: [{ step: poll, state: errored, exception: iteration_limit }]
      state:
        parameters: {}
        results:
          poll: [{ done: false }, { done: false }]
  - resume: { step: poll, payload: 1 }
expect:
  status: terminal
  outcome: complete
  value: { done: true }
  state:
    parameters: {}
    results:
      poll: [{ done: false }, { done: false }, { done: true }]
      finish: [{ done: true }]
