mock: "0.1"
agent: writer
sessions:
  - model: mock-medium
    turns:
      - expect: { step: draft, prompt: "Write a title." }
        events:
          - usage: { input_tokens: 500, output_tokens: 50 }
          - complete: { output: { headline: "Wrong key" } }
      - events:
          - usage: { input_tokens: 900, output_tokens: 40 }
          - complete: { output: "Title: not even an object" }
