mock: "0.1"
agent: planner
sessions:
  - name: plan
    model: mock-medium
    turns:
      - expect:
          step: plan
          prompt: "Plan «this» issue: add a --verbose flag (p2)"
        events:
          - reasoning: "The CLI parser lives in src/cli.ts."
          - tool_call: { id: t1, name: read_file, input: { path: src/cli.ts } }
          - tool_result: { id: t1, output: "export function parse(argv) { … }" }
          - usage: { input_tokens: 8000, output_tokens: 1200, cache_read_tokens: 4000 }
          - message: "Plan ready."
          - complete:
              output: { plan: "add a --verbose flag to parse()" }
