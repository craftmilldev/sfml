mock: "0.1"
agent: linter
description: 120,000 mock-small output tokens cost exactly 0.60 USD; 20,000 cost 0.10 USD.
sessions:
  - model: mock-small
    turns:
      - expect: { step: checks.lint, prompt: "Lint the branch." }
        events:
          - usage: { output_tokens: 120000 }
          - barrier: reported
          - complete: { output: { passed: true } }
      - events:
          - usage: { output_tokens: 20000 }
          - complete: { output: { passed: true } }
