description: >
  Two concurrent children each report 0.60 against a run budget of 1.00. The second report crosses
  the ceiling, so both children stop, and budget_exceeded is addressed to the parallel step `checks`,
  never to a child. A 0.50 grant re-runs both children on their own sessions; each finishes for
  0.10 (1.40 of an effective 1.50).
clauses: ["§6.7", "§9.7", "§9.8", "§10.6", "§11.1", "§11.3", "§11.7"]
actions:
  - start: {}
    expect:
      status: errored
      blocked: [{ step: checks, state: errored, exception: budget_exceeded }]
      state: { parameters: {}, results: {} }
  - resume: { step: checks.lint, payload: 0.50 }
    expect:
      accepted: false
      status: errored
      blocked: [{ step: checks, state: errored, exception: budget_exceeded }]
  - resume: { step: checks, payload: 0.50 }
expect:
  status: terminal
  outcome: complete
  value:
    lint: { passed: true }
    test: { failures: 0 }
  state:
    parameters: {}
    results:
      checks: [{ lint: { passed: true }, test: { failures: 0 } }]
      done: [{ lint: { passed: true }, test: { failures: 0 } }]
