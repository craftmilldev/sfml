class: runner
description: >
  Two concurrent children each report 0.60 against a factory budget of 1.00, then meet at barrier
  `reported`. Whichever report lands second pushes the pool past the ceiling. The Runner closes
  that child, which releases the barrier. The other child reaches its terminal event, a report
  point, and is closed there too. Either way, both children are incomplete, and budget_exceeded is
  addressed to the parallel step `checks`, never to a child. A 0.50 grant re-forks both children onto
  their own sessions (mock rule S3). Each finishes for 0.10: 1.40 in total, under the effective 1.50.
  A Runner that ran the children one after another would deadlock at the barrier.
clauses: ["§6.7", "§9.7", "§9.8", "§10.6", "§11.1", "§11.3", "§11.7"]
drive:
  - start: {}
    expect:
      admitted: true
      status: errored
      blocked:
        - { step: checks, state: errored, exception: budget_exceeded }
      state: { parameters: {}, results: {} }
      trace: ["checks"]
  - resume: { step: checks.lint, payload: 0.50 }
    expect:
      accepted: false
      status: errored
      blocked:
        - { step: checks, state: errored, exception: budget_exceeded }
  - resume: { step: checks, payload: 0.50 }
    expect:
      accepted: true
      status: terminal
