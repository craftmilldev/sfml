sfml: "v0.1"
start: checks
budget: 1.00
steps:
  checks:
    type: parallel
    steps:
      lint:
        type: agent
        harness: mock
        harness_config: { agent: linter }
        prompt: "Lint the branch."
        result_schema:
          type: object
          required: [passed]
          properties: { passed: { type: boolean } }
      test:
        type: agent
        harness: mock
        harness_config: { agent: tester }
        prompt: "Test the branch."
        result_schema:
          type: object
          required: [failures]
          properties: { failures: { type: integer } }
    next:
      - to: done
  done:
    type: result
    outcome: complete
    value: last(results.checks)
