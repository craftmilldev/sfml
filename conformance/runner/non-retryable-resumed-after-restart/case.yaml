description: >
  A non-retryable failure raises harness_error on the first attempt, although `retry: 3` would allow
  more. The Runner dies and restarts while the step is errored. A resume with no payload re-runs the
  step on the same session (SPEC §11.7), so the session has to survive the restart.
clauses: ["§6.10", "§10.3", "§11.4", "§11.7", "§12.1"]
actions:
  - start: {}
    expect:
      status: errored
      blocked: [{ step: work, state: errored, exception: harness_error }]
      state: { parameters: {}, results: {} }
  - restart: {}
    expect:
      status: errored
      blocked: [{ step: work, state: errored, exception: harness_error }]
      state: { parameters: {}, results: {} }
  - resume: { step: work }
expect:
  status: terminal
  outcome: complete
  value: { ok: true }
  state:
    parameters: {}
    results:
      work: [{ ok: true }]
      done: [{ ok: true }]
