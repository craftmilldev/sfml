sfml: "v0.1"
start: work
steps:
  work:
    type: agent
    harness: mock
    harness_config: { agent: ghost }
    retry: 3
    prompt: "Do the work."
    result_schema:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    next:
      - to: done
  done:
    type: result
    outcome: complete
    value: last(results.work)
