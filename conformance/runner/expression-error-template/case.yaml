description: >
  `summarize`'s template is well-formed and passes lint, but its placeholder indexes the first line
  of an empty list, so rendering fails. The entry raises expression_error before the harness is
  invoked. An override supplies the step's result.
clauses: ["§7.7", "§7.9", "§9.9", "§10.7", "§11.4"]
actions:
  - start: {}
    expect:
      status: errored
      blocked: [{ step: summarize, state: errored, exception: expression_error }]
      state:
        parameters: {}
        results:
          fetch: [{ lines: [] }]
  - resume: { step: summarize, payload: { summary: "Nothing to summarize." } }
expect:
  status: terminal
  outcome: complete
  value: { summary: "Nothing to summarize." }
  state:
    parameters: {}
    results:
      fetch: [{ lines: [] }]
      summarize: [{ summary: "Nothing to summarize." }]
      done: [{ summary: "Nothing to summarize." }]
