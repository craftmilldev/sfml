description: >
  `summarize`'s prompt template opens a placeholder with `««` and never closes it. That is a parse
  failure at render time, not literal text, so the entry raises expression_error before the harness
  is invoked. An override supplies the step's result.
clauses: ["§7.9", "§9.9", "§10.7", "§11.4"]
actions:
  - start: {}
    expect:
      status: errored
      blocked: [{ step: summarize, state: errored, exception: expression_error }]
      state:
        parameters: {}
        results:
          fetch: [{ text: "The deploy finished at noon." }]
  - resume: { step: summarize, payload: { summary: "Deployed." } }
expect:
  status: terminal
  outcome: complete
  value: { summary: "Deployed." }
  state:
    parameters: {}
    results:
      fetch: [{ text: "The deploy finished at noon." }]
      summarize: [{ summary: "Deployed." }]
      done: [{ summary: "Deployed." }]
