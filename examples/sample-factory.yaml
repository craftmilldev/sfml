sfml: "v0.1"
description: A small worked factory for the mermaid example.
start: plan
steps:
  plan:
    type: agent
    harness: claude-code@1
    prompt: "Plan the change for «« prompt_vars.issue »»."
    prompt_vars:
      issue: parameters.issue
    result_schema:
      type: object
    next:
      - when: "results.plan.size(last(results.plan).files) > 20"
        to: review
      - to: checks

  checks:
    type: parallel
    steps:
      lint:
        type: agent
        harness: claude-code@1
        prompt: "Lint the change."
        result_schema:
          type: object
      audit:
        type: human
        assignee: security-team
        result_schema:
          type: object
    next:
      - to: review

  review:
    type: human
    assignee: eng-lead
    result_schema:
      type: object
    next:
      - when: "last(results.review).approved"
        to: done
      - to: failed

  done:
    type: result
    outcome: complete

  failed:
    type: result
    outcome: terminal_failure
